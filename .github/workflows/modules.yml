name: Camera modules

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

# All publishing runs share one queue, including manual runs and reruns.
concurrency:
  group: camera-modules-release
  cancel-in-progress: false

jobs:
  modules:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM18 and kernel build dependencies
        run: sudo bash scripts/install-deps.sh
      - name: Check release contract
        run: python3 -m unittest discover -s tests -v
      - name: Resolve current board main and fixed kernel baseline
        run: python3 scripts/prepare.py
      - name: Build lym10k kernel and modules
        run: python3 scripts/build.py lym10k
      - name: Build t512n kernel and modules
        run: python3 scripts/build.py t512n
      - name: Preserve effective configs and build inputs
        uses: actions/upload-artifact@v4
        with:
          name: camera-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
      - name: Publish both profiles and merged index
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish.py
